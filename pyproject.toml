[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-baseline-evidence-lab"
version = "0.10.2"
description = "Evidence-driven AI coding-agent governance from Docker Sandbox execution to verifiable OCI artifact lineage and signed customer handoff."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Riccardo Menegazzo"}]
dependencies = ["PyYAML>=6.0.2,<7", "cryptography>=46,<47"]
keywords = ["docker", "docker-sandboxes", "docker-scout", "ai-agents", "security", "governance", "mcp", "sbom", "slsa", "provenance", "oci", "agent-baseline", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/riccardomenegazzo/agent-baseline-evidence-lab"
Repository = "https://github.com/riccardomenegazzo/agent-baseline-evidence-lab"
Documentation = "https://github.com/riccardomenegazzo/agent-baseline-evidence-lab/tree/main/docs"
Issues = "https://github.com/riccardomenegazzo/agent-baseline-evidence-lab/issues"
Changelog = "https://github.com/riccardomenegazzo/agent-baseline-evidence-lab/releases"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1", "build>=1.2,<2"]

[project.scripts]
abl = "agent_baseline_lab.cli:main"
abl-trust = "agent_baseline_lab.customer_trust_flow:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Semantic/bug-oriented gate. Import ordering is intentionally left to editor tooling.
select = ["E4", "E7", "E9", "F", "UP", "B", "BLE", "SIM", "PIE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Evaluators are an isolation boundary: unexpected plugin failures become ERROR results.
# The cleanup pattern is kept local here to avoid changing the mature probe function in a lint-only patch.
"src/agent_baseline_lab/evaluators.py" = ["BLE001", "SIM102", "SIM105", "UP035"]
"src/agent_baseline_lab/cli.py" = ["BLE001"]
