[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-baseline-evidence-lab"
version = "0.5.0"
description = "Evidence-driven implementation assessment for the Agent Baseline v1.0-draft, with Docker Sandboxes adapters."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Riccardo Menegazzo"}]
dependencies = ["PyYAML>=6.0.2,<7"]
keywords = ["docker", "ai-agents", "security", "mcp", "agent-baseline", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
abl = "agent_baseline_lab.cli:main"
abl-mcp-correlate = "agent_baseline_lab.correlate_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Semantic/bug-oriented gate. Import ordering is intentionally left to editor tooling.
select = ["E4", "E7", "E9", "F", "UP", "B", "BLE", "SIM", "PIE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Evaluators are an isolation boundary: unexpected plugin failures become ERROR results.
# The cleanup pattern is kept local here to avoid changing the mature probe function in a lint-only patch.
"src/agent_baseline_lab/evaluators.py" = ["BLE001", "SIM102", "SIM105", "UP035"]
"src/agent_baseline_lab/cli.py" = ["BLE001"]
