[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-baseline-evidence-lab"
version = "0.4.0"
description = "Evidence-driven implementation assessment for the Agent Baseline v1.0-draft, with Docker Sandboxes adapters."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Riccardo Menegazzo"}]
dependencies = ["PyYAML>=6.0.2,<7"]
keywords = ["docker", "ai-agents", "security", "mcp", "agent-baseline", "evidence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
abl = "agent_baseline_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
