name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts sample-app
      - run: pytest
      - name: Build distributable package
        run: python -m build
      - name: Smoke-test wheel entrypoint
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          abl --help
          abl-trust --help
          python -m agent_baseline_lab.readiness --help
          python -m agent_baseline_lab.portable_pack --help
          python -m agent_baseline_lab.golden_flow --help
          python -m agent_baseline_lab.customer_trust_flow --help
          python -m agent_baseline_lab.trust_handoff --help
          python -m agent_baseline_lab.governance_delta --help
          python -m agent_baseline_lab.comparison_pack --help
          python -m agent_baseline_lab.experiment_protocol --help
      - run: python -m unittest discover -s sample-app/tests -v
      - name: Exercise metadata-only live-run capsule
        run: abl live-run --config examples/agent.yaml --task examples/task.md --dry-run --assess
      - name: Exercise non-destructive response-drill contract
        run: >-
          python -m agent_baseline_lab.response
          --sandbox abl-demo
          --output .abl/response/ci-stop-dry-run.json
          --dry-run
          --test-disposable-secret-revocation
      - name: Assert response dry-run never claims containment or revocation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('.abl/response/ci-stop-dry-run.json').read_text())
          assert payload['schema_version'] == 2
          assert payload['verified_stopped'] is False
          assert payload['credential_revocation_tested'] is False
          assert payload['credential_evidence'] == {}
          PY
      - name: Exercise provider revocation adapter in fail-closed dry-run mode
        run: >-
          python -m agent_baseline_lab.provider_revocation
          docker-mcp-oauth dhi
          --output reports/provider-revocation-dry.json
      - name: Assert provider dry-run never claims revocation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/provider-revocation-dry.json').read_text())
          assert payload['attempted'] is False
          assert payload['local_credential_removed'] is False
          assert payload['upstream_revocation_proven'] is False
          assert payload['secret_material_persisted'] is False
          PY
      - name: Exercise non-agent fallback validation
        run: >-
          python -m agent_baseline_lab.fallback
          --workspace sample-app
          --reviewer ci-human-reviewer
          --reason "agent disabled for CI fallback contract"
          --command "python3 -m unittest discover -s tests -v"
          --output reports/fallback.json
      - name: Exercise full customer evidence orchestration without Docker mutation
        run: >-
          python -m agent_baseline_lab.interview_demo
          --config examples/agent.yaml
          --task examples/task.md
          --dry-run
      - name: Assert dry-run orchestration cannot produce positive response claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summaries = sorted(Path('reports').glob('*.interview-demo.json'), key=lambda p: p.stat().st_mtime)
          assert summaries, 'customer-flow summary missing'
          payload = json.loads(summaries[-1].read_text())
          assert payload['agent_executed'] is False
          assert payload['sandbox_stop_verified'] is False
          assert payload['credential_binding_revocation_verified'] is False
          assert payload['response_link_verified'] is False
          assert payload['response_link'] == ''
          assert payload['quarantine_registered'] is False
          assert payload['incident_bundle_verified'] is False
          PY
      - name: Run offline-safe assessment
        run: |
          set +e
          abl assess --config examples/agent.yaml
          rc=$?
          test "$rc" -eq 0 -o "$rc" -eq 1
      - name: Verify generated evidence bundle
        run: |
          latest=$(ls -1dt evidence/abl-* | head -1)
          abl verify "$latest"
      - name: Run evidence adversarial verification matrix
        run: |
          latest=$(ls -1dt evidence/abl-* | head -1)
          python -m agent_baseline_lab.evidence_matrix \
            "$latest" \
            --output reports/evidence-verification-matrix.json
      - name: Assert evidence trust boundaries remain explicit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/evidence-verification-matrix.json').read_text())
          scenarios = {item['id']: item for item in payload['scenarios']}
          assert scenarios['single-file-alteration']['internal_verifier_passed'] is False
          assert scenarios['trace-truncation']['internal_verifier_passed'] is False
          assert scenarios['coordinated-rewrite']['internal_verifier_passed'] is True
          assert scenarios['coordinated-rewrite']['externally_anchored_verifier_passed'] is False
          assert scenarios['event-never-emitted']['internal_verifier_passed'] is True
          assert scenarios['event-never-emitted']['externally_anchored_verifier_passed'] is True
          PY
      - name: Verify provenance attestation subject binding
        run: |
          latest=$(ls -1dt evidence/abl-* | head -1)
          run_id=$(basename "$latest")
          abl verify-attestation \
            "reports/${run_id}.attestation.json" \
            "${latest}/manifest.sha256.json"
      - name: Sign and verify the generated run attestation with an external CI Ed25519 key
        run: |
          latest=$(ls -1dt evidence/abl-* | head -1)
          run_id=$(basename "$latest")
          python -m agent_baseline_lab.signing keygen \
            --private .abl/keys/attestation-private.json \
            --public .abl/keys/attestation-public.json
          python -m agent_baseline_lab.signing sign \
            "reports/${run_id}.attestation.json" \
            --private .abl/keys/attestation-private.json \
            --output "reports/${run_id}.attestation.json.ed25519.json"
          python -m agent_baseline_lab.signing verify \
            "reports/${run_id}.attestation.json" \
            "reports/${run_id}.attestation.json.ed25519.json" \
            --public .abl/keys/attestation-public.json
      - name: Create verify and sign governance self-delta on real evidence
        run: |
          latest=$(ls -1dt evidence/abl-* | head -1)
          python -m agent_baseline_lab.governance_delta create \
            "$latest" "$latest" \
            --output reports/governance-delta.json \
            --html reports/governance-delta.html
          python -m agent_baseline_lab.governance_delta verify \
            reports/governance-delta.json "$latest" "$latest"
          python -m agent_baseline_lab.signing sign \
            reports/governance-delta.json \
            --private .abl/keys/attestation-private.json \
            --output reports/governance-delta.json.ed25519.json
          python -m agent_baseline_lab.signing verify \
            reports/governance-delta.json \
            reports/governance-delta.json.ed25519.json \
            --public .abl/keys/attestation-public.json
      - name: Assert self-delta has no invented scoring or changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/governance-delta.json').read_text())
          assert payload['comparable'] is True
          assert payload['change_counts'] == {'unchanged': 35}
          assert payload['before']['manifest_sha256'] == payload['after']['manifest_sha256']
          assert 'score' not in payload
          assert 'security_score' not in payload
          assert 'risk_score' not in payload
          PY
      - name: Create and verify offline comparison handoff on distinct real evidence
        run: |
          sleep 1
          set +e
          abl assess --config examples/agent.yaml
          rc=$?
          set -e
          test "$rc" -eq 0 -o "$rc" -eq 1
          mapfile -t runs < <(ls -1dt evidence/abl-* | head -2)
          test "${#runs[@]}" -eq 2
          after="${runs[0]}"
          before="${runs[1]}"
          test "$(basename "$before")" != "$(basename "$after")"
          python -m agent_baseline_lab.comparison_pack create \
            "$before" "$after" \
            --root . \
            --output reports/governance-comparison-pack.zip
          python -m agent_baseline_lab.comparison_pack verify \
            reports/governance-comparison-pack.zip \
            --signature reports/governance-comparison-pack.zip.ed25519.json \
            --public .abl/keys/attestation-public.json
      - name: Assert comparison handoff is self-contained and private-key free
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          pack = Path('reports/governance-comparison-pack.zip')
          with zipfile.ZipFile(pack) as zf:
              names = set(zf.namelist())
              assert 'comparison-manifest.json' in names
              assert 'before/customer-evidence-pack.zip' in names
              assert 'after/customer-evidence-pack.zip' in names
              assert 'comparison/governance-delta.json' in names
              assert 'comparison/governance-delta.json.ed25519.json' in names
              assert 'trust/attestation-public.json' in names
              assert not any(name.endswith('attestation-private.json') for name in names)
              manifest = json.loads(zf.read('comparison-manifest.json'))
              assert manifest['before_run_id'] != manifest['after_run_id']
              delta = json.loads(zf.read('comparison/governance-delta.json'))
              assert delta['change_counts'] == {'unchanged': 35}
          PY
      - name: Gate consolidated post-run assurance suite
        run: >-
          python -m agent_baseline_lab.assurance_suite
          --output reports/assurance-summary.json
      - name: Assert assurance suite has no blocking failures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/assurance-summary.json').read_text())
          assert payload['blocking_failures'] == 0
          checks = {item['name']: item for item in payload['checks']}
          assert checks['assessment-bundle-integrity']['status'] == 'PASS'
          assert checks['evidence-trust-boundary-regression']['status'] == 'PASS'
          assert checks['attestation-signature']['status'] == 'PASS'
          assert checks['external-signing-anchor']['status'] == 'PASS'
          PY
      - name: Create and verify portable customer evidence pack
        run: |
          python -m agent_baseline_lab.portable_pack create \
            --output reports/customer-evidence-pack.zip
          python -m agent_baseline_lab.portable_pack verify \
            reports/customer-evidence-pack.zip
      - name: Assert portable pack privacy and trust material boundary
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path
          pack = Path('reports/customer-evidence-pack.zip')
          project = str(Path.cwd().resolve()).encode()
          home = str(Path.home().resolve()).encode()
          with zipfile.ZipFile(pack) as zf:
              names = set(zf.namelist())
              assert 'pack-manifest.json' in names
              assert 'trust/attestation-public.json' in names
              assert not any(name.endswith('attestation-private.json') for name in names)
              manifest = json.loads(zf.read('pack-manifest.json'))
              assert 'private signing keys' in manifest['excluded_categories']
              assert 'local project/home path prefixes' in manifest['excluded_categories']
              for name in names:
                  data = zf.read(name)
                  assert project not in data, f'project path leaked in {name}'
                  assert home not in data, f'home path leaked in {name}'
          PY
      - name: Exercise complete golden flow without live Docker mutation
        run: python -m agent_baseline_lab.golden_flow --profile community --dry-run
      - name: Assert golden dry-run is signed and never claims live response evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summaries = sorted(Path('reports').glob('abl-*.golden-flow.json'), key=lambda p: p.stat().st_mtime)
          assert summaries, 'golden-flow summary missing'
          payload = json.loads(summaries[-1].read_text())
          assert payload['dry_run'] is True
          assert payload['readiness_checked'] is False
          assert payload['readiness_ready'] is None
          assert payload['baseline_signature_checked'] is False
          assert payload['baseline_signature_verified'] is None
          assert payload['response_link_verified'] is False
          assert payload['quarantine_registered'] is False
          assert payload['incident_bundle_verified'] is False
          assert payload['attestation_signature_verified'] is True
          assert payload['assurance_blocking_failures'] == 0
          assert payload['customer_pack_verified'] is True
          assert payload['customer_pack_signature_verified'] is True
          pack = Path(payload['customer_pack'])
          signature = Path(payload['customer_pack_signature'])
          assert pack.is_file()
          assert signature.is_file()
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: assessment-report
          path: |
            reports/
            evidence/
            agent-runs/
            dist/
            .abl/response/
