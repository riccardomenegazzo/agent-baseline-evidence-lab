name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - run: ruff check src tests scripts sample-app
      - run: pytest
      - run: python -m unittest discover -s sample-app/tests -v
      - name: Exercise metadata-only live-run capsule
        run: abl live-run --config examples/agent.yaml --task examples/task.md --dry-run --assess
      - name: Exercise non-destructive response-drill contract
        run: >-
          python -m agent_baseline_lab.response
          --sandbox abl-demo
          --output .abl/response/ci-stop-dry-run.json
          --dry-run
          --test-disposable-secret-revocation
      - name: Assert response dry-run never claims containment or revocation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('.abl/response/ci-stop-dry-run.json').read_text())
          assert payload['schema_version'] == 2
          assert payload['verified_stopped'] is False
          assert payload['credential_revocation_tested'] is False
          assert payload['credential_evidence'] == {}
          PY
      - name: Exercise provider revocation adapter in fail-closed dry-run mode
        run: >-
          python -m agent_baseline_lab.provider_revocation
          docker-mcp-oauth dhi
          --output reports/provider-revocation-dry.json
      - name: Assert provider dry-run never claims revocation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/provider-revocation-dry.json').read_text())
          assert payload['attempted'] is False
          assert payload['local_credential_removed'] is False
          assert payload['upstream_revocation_proven'] is False
          assert payload['secret_material_persisted'] is False
          PY
      - name: Exercise non-agent fallback validation
        run: >-
          python -m agent_baseline_lab.fallback
          --workspace sample-app
          --reviewer ci-human-reviewer
          --reason "agent disabled for CI fallback contract"
          --command python3 -m unittest discover -s tests -v
          --output reports/fallback.json
      - name: Exercise full interview orchestration without Docker mutation
        run: >-
          python -m agent_baseline_lab.interview_demo
          --config examples/agent.yaml
          --task examples/task.md
          --dry-run
      - name: Assert interview dry-run cannot produce positive response claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summaries = sorted(Path('reports').glob('*.interview-demo.json'), key=lambda p: p.stat().st_mtime)
          assert summaries, 'interview-demo summary missing'
          payload = json.loads(summaries[-1].read_text())
          assert payload['agent_executed'] is False
          assert payload['sandbox_stop_verified'] is False
          assert payload['credential_binding_revocation_verified'] is False
          assert payload['response_link_verified'] is False
          assert payload['response_link'] == ''
          PY
      - name: Run offline-safe assessment
        run: |
          set +e
          abl assess --config examples/agent.yaml
          rc=$?
          test "$rc" -eq 0 -o "$rc" -eq 1
      - name: Verify generated evidence bundle
        run: |
          latest=$(ls -1dt evidence/abl-* | head -1)
          abl verify "$latest"
      - name: Run evidence adversarial verification matrix
        run: |
          latest=$(ls -1dt evidence/abl-* | head -1)
          python -m agent_baseline_lab.evidence_matrix \
            "$latest" \
            --output reports/evidence-verification-matrix.json
      - name: Assert evidence trust boundaries remain explicit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('reports/evidence-verification-matrix.json').read_text())
          scenarios = {item['id']: item for item in payload['scenarios']}
          assert scenarios['single-file-alteration']['internal_verifier_passed'] is False
          assert scenarios['trace-truncation']['internal_verifier_passed'] is False
          assert scenarios['coordinated-rewrite']['internal_verifier_passed'] is True
          assert scenarios['coordinated-rewrite']['externally_anchored_verifier_passed'] is False
          assert scenarios['event-never-emitted']['internal_verifier_passed'] is True
          assert scenarios['event-never-emitted']['externally_anchored_verifier_passed'] is True
          PY
      - name: Verify provenance attestation subject binding
        run: |
          latest=$(ls -1dt evidence/abl-* | head -1)
          run_id=$(basename "$latest")
          abl verify-attestation \
            "reports/${run_id}.attestation.json" \
            "${latest}/manifest.sha256.json"
      - name: Sign and verify the generated run attestation with an ephemeral CI Ed25519 key
        run: |
          latest=$(ls -1dt evidence/abl-* | head -1)
          run_id=$(basename "$latest")
          python -m agent_baseline_lab.signing keygen \
            --private .abl/ci-signing/private.json \
            --public .abl/ci-signing/public.json
          python -m agent_baseline_lab.signing sign \
            "reports/${run_id}.attestation.json" \
            --private .abl/ci-signing/private.json \
            --output "reports/${run_id}.attestation.ed25519.json"
          python -m agent_baseline_lab.signing verify \
            "reports/${run_id}.attestation.json" \
            "reports/${run_id}.attestation.ed25519.json" \
            --public .abl/ci-signing/public.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assessment-report
          path: |
            reports/
            evidence/
            agent-runs/
            .abl/response/
