name: release

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 0.13.0)"
        required: true
        type: string
        default: "0.13.0"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail

          project_version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          payload = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(payload['project']['version'])
          PY
          )

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
            tag="v${version}"
            source_commit="${GITHUB_SHA}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            version="$project_version"
            tag="v${version}"
            source_commit='${{ github.event.workflow_run.head_sha }}'
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            source_commit="${GITHUB_SHA}"
          fi

          case "$version" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "Invalid release version: $version" >&2
              exit 1
              ;;
          esac

          if [ "$version" != "$project_version" ]; then
            echo "Release version $version does not match pyproject.toml version $project_version" >&2
            exit 1
          fi

          notes="docs/releases/v${version}.md"
          if [ ! -f "$notes" ]; then
            echo "Release notes are missing: $notes" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; published assets are immutable and will not be overwritten."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tooling
        if: steps.existing.outputs.exists != 'true'
        run: python -m pip install "build>=1.2,<2"

      - name: Build wheel and source distribution
        if: steps.existing.outputs.exists != 'true'
        run: python -m build

      - name: Create release manifest and checksums
        if: steps.existing.outputs.exists != 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path('dist')
          artifacts = sorted(
              path for path in dist.iterdir()
              if path.is_file() and (path.suffix == '.whl' or path.name.endswith('.tar.gz'))
          )
          if len(artifacts) != 2:
              raise SystemExit(f'expected wheel + sdist, found {[p.name for p in artifacts]}')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(65536), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest = {
              'schema_version': 2,
              'project': 'agent-baseline-evidence-lab',
              'version': os.environ['RELEASE_VERSION'],
              'tag': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'artifacts': [
                  {
                      'name': path.name,
                      'sha256': sha256(path),
                      'bytes': path.stat().st_size,
                  }
                  for path in artifacts
              ],
              'external_provenance': {
                  'provider': 'GitHub artifact attestations',
                  'predicate': 'SLSA build provenance',
                  'verification': 'gh attestation verify <artifact> --repo riccardomenegazzo/agent-baseline-evidence-lab',
                  'generated_after_manifest': True,
              },
              'claims_boundary': (
                  'SHA-256 entries bind the downloadable Python artifacts to this manifest and source commit. '
                  'The release workflow additionally creates GitHub/Sigstore-backed SLSA build provenance '
                  'attestations for the release files. Verification establishes workflow/repository provenance '
                  'for those subjects; it is not a statement that the software is vulnerability-free or certified.'
              ),
          }
          (dist / 'release-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          (cd dist && sha256sum *.whl *.tar.gz release-manifest.json > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Smoke-test the built wheel in a clean environment
        if: steps.existing.outputs.exists != 'true'
        run: |
          set -euo pipefail
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install -U pip
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/abl --help >/dev/null
          .release-smoke/bin/abl-trust --help >/dev/null
          .release-smoke/bin/abl-policy --help >/dev/null
          .release-smoke/bin/abl-accept --help >/dev/null
          .release-smoke/bin/abl-policy list-profiles | grep -qx 'poc-observe'
          .release-smoke/bin/abl-policy list-profiles | grep -qx 'enterprise-strict'
          policy_tmp=$(mktemp)
          .release-smoke/bin/abl-policy export-profile enterprise-strict --output "$policy_tmp"
          test -s "$policy_tmp"
          grep -q '^id: enterprise-strict$' "$policy_tmp"
          .release-smoke/bin/python -m agent_baseline_lab.comparison_pack --help >/dev/null
          .release-smoke/bin/python -m agent_baseline_lab.trusted_artifact --help >/dev/null
          .release-smoke/bin/python -m agent_baseline_lab.trust_handoff --help >/dev/null
          .release-smoke/bin/python -m agent_baseline_lab.customer_trust_flow --help >/dev/null

      - name: Generate SLSA provenance for release artifacts
        if: steps.existing.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-manifest.json
            dist/SHA256SUMS

      - name: Verify GitHub artifact attestations before publication
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in dist/*.whl dist/*.tar.gz dist/release-manifest.json dist/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done

      - name: Publish immutable GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          SOURCE_COMMIT: ${{ steps.release.outputs.source_commit }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            dist/release-manifest.json \
            --target "$SOURCE_COMMIT" \
            --title "Agent Baseline Evidence Lab v${RELEASE_VERSION}" \
            --notes-file "$RELEASE_NOTES"
