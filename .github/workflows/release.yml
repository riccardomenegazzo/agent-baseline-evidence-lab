name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 0.9.0)"
        required: true
        type: string
        default: "0.9.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi

          case "$version" in
            ''|*[!0-9A-Za-z.+-]*)
              echo "Invalid release version: $version" >&2
              exit 1
              ;;
          esac

          project_version=$(python - <<'PY'
          import tomllib
          from pathlib import Path
          payload = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(payload['project']['version'])
          PY
          )

          if [ "$version" != "$project_version" ]; then
            echo "Release version $version does not match pyproject.toml version $project_version" >&2
            exit 1
          fi

          notes="docs/releases/v${version}.md"
          if [ ! -f "$notes" ]; then
            echo "Release notes are missing: $notes" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Install build tooling
        run: python -m pip install "build>=1.2,<2"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Create release manifest and checksums
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path('dist')
          artifacts = sorted(
              path for path in dist.iterdir()
              if path.is_file() and path.suffix in {'.whl', '.gz'}
          )
          if len(artifacts) != 2:
              raise SystemExit(f'expected wheel + sdist, found {[p.name for p in artifacts]}')

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(65536), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest = {
              'schema_version': 1,
              'project': 'agent-baseline-evidence-lab',
              'version': os.environ['RELEASE_VERSION'],
              'tag': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['GITHUB_SHA'],
              'artifacts': [
                  {
                      'name': path.name,
                      'sha256': sha256(path),
                      'bytes': path.stat().st_size,
                  }
                  for path in artifacts
              ],
              'claims_boundary': (
                  'This manifest binds the downloadable Python artifacts to the GitHub Actions '
                  'source commit by SHA-256. It does not by itself provide an external identity '
                  'attestation for the GitHub repository or workflow runner.'
              ),
          }
          (dist / 'release-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          (cd dist && sha256sum *.whl *.tar.gz release-manifest.json > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Smoke-test the built wheel in a clean environment
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install -U pip
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/abl --help >/dev/null
          .release-smoke/bin/python -m agent_baseline_lab.comparison_pack --help >/dev/null

      - name: Ensure the release tag is immutable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite published assets." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            dist/release-manifest.json \
            --target "$GITHUB_SHA" \
            --title "Agent Baseline Evidence Lab v${RELEASE_VERSION}" \
            --notes-file "$RELEASE_NOTES"
