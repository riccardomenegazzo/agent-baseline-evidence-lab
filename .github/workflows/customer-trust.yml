name: customer-trust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: customer-trust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - name: Smoke-test installed Customer Trust entrypoint
        run: abl-trust --help
      - name: Generate ephemeral CI signing identity
        run: >-
          python -m agent_baseline_lab.signing keygen
          --private .abl/keys/attestation-private.json
          --public .abl/keys/attestation-public.json
      - name: Exercise trusted-artifact contract without Docker mutation
        run: >-
          python -m agent_baseline_lab.trusted_artifact build sample-app
          --dry-run --scout-mode off
      - name: Run installed Customer Trust Flow in fail-closed dry-run mode
        run: abl-trust --profile community --dry-run --scout-mode off
      - name: Assert dry-run trust semantics and signed handoff
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          summaries = sorted(
              Path('reports').glob('abl-*.customer-trust-flow.json'),
              key=lambda path: path.stat().st_mtime,
          )
          assert summaries, 'customer trust flow summary missing'
          payload = json.loads(summaries[-1].read_text())
          assert payload['dry_run'] is True
          assert payload['overall_status'] == 'DRY_RUN'
          assert payload['lineage_created'] is False
          assert payload['lineage_verified'] is False
          assert payload['trusted_artifact_status'] == 'NOT_RUN'
          assert payload['handoff_verified'] is True
          assert payload['handoff_signature_verified'] is True

          handoff = Path(payload['handoff_pack'])
          signature = Path(payload['handoff_signature'])
          assert handoff.is_file()
          assert signature.is_file()

          project = str(Path.cwd().resolve()).encode()
          home = str(Path.home().resolve()).encode()
          with zipfile.ZipFile(handoff) as zf:
              names = set(zf.namelist())
              assert 'handoff-manifest.json' in names
              assert 'evidence/customer-evidence-pack.zip' in names
              assert 'supply-chain/trusted-artifact.json' in names
              assert 'decision/customer-decision.json' in names
              assert 'integrations/agent-governance.sarif' in names
              assert 'customer-trust-flow.html' in names
              assert not any(name.endswith('attestation-private.json') for name in names)
              assert not any(name.endswith('.oci.tar') for name in names)
              for name in names:
                  data = zf.read(name)
                  assert project not in data, f'project path leaked in {name}'
                  assert home not in data, f'home path leaked in {name}'
          PY
      - name: Verify presentation files and statuses against signed handoff
        run: abl-present --json
      - name: Independently verify customer trust handoff
        run: |
          latest=$(ls -1t reports/abl-*.customer-trust-handoff.zip | head -1)
          python -m agent_baseline_lab.trust_handoff "$latest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: customer-trust-dry-run
          path: |
            reports/
            evidence/
            agent-runs/

